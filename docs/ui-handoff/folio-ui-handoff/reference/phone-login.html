<!doctype html>
<!--
  Folio UI reference: Sign in (phone)
  STATIC REFERENCE, NOT PRODUCTION CODE. Exported from the design canvas.
  - Colors, radii, type: use frontend/src/styles/tokens.css, not the inline values here.
  - To preview dark mode, change data-theme="light" on the root element to "dark".
  - Icons use the Material Symbols web font for preview only; build with @material-symbols/svg-400 (rounded).
  - Menus are present in the DOM; closed ones carry `hidden`.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio reference: Sign in (phone)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400&amp;family=Manrope:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,400&amp;family=Outfit:wght@600&amp;family=Inter:wght@400;500;600&amp;family=Literata:opsz,wght@7..72,400&amp;display=swap">
<style>
body{margin:0}
[data-theme="light"]{--bg:#F6F7FB;--surface:#FFFFFF;--raised:#EEF1F7;--divider:#E3E6EF;--control-border:#7E8599;--text:#1E2235;--text-2:#5B6275;--accent-text:#1559B5;--selected:#EEF1FD;--on-selected:#1559B5;--on-primary:#FFFFFF;--progress:#2381F7;--track:#E3E6EF;--paper:#FDFCF9;--paper-border:#E8E4DA;--reading-text:#2A2D3A;--highlight:#DDE3FD;--avatar-bg:#1E2235;--avatar-fg:#FFFFFF;--grabber:#C9CEDC;color-scheme:light}
[data-theme="dark"]{--bg:#12141F;--surface:#1A1D2B;--raised:#232738;--divider:#2C3145;--control-border:#6B7289;--text:#EDEFF5;--text-2:#A3A9BA;--accent-text:#8EA2F9;--selected:#252B4D;--on-selected:#B4C1FB;--on-primary:#FFFFFF;--progress:#5B8DF9;--track:#2C3145;--paper:#171A24;--paper-border:#262A38;--reading-text:#D9DCE6;--highlight:#2E3666;--avatar-bg:#8EA2F9;--avatar-fg:#12141F;--grabber:#4A5068;color-scheme:dark}
[data-type="jakarta"]{--font-ui:'Plus Jakarta Sans';--font-display:'Plus Jakarta Sans';--font-reading:'Newsreader'}
[data-type="manrope"]{--font-ui:'Manrope';--font-display:'Manrope';--font-reading:'Source Serif 4'}
[data-type="classic"]{--font-ui:'Inter';--font-display:'Outfit';--font-reading:'Literata'}
:lang(ja){font-family:var(--font-ui),'Hiragino Sans','Yu Gothic UI','Noto Sans JP',system-ui,sans-serif}
:lang(ko){font-family:var(--font-ui),'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;word-break:keep-all}
:lang(zh){font-family:var(--font-ui),'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif}
:lang(zh-TW),:lang(zh-Hant){font-family:var(--font-ui),'PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif}
.reading:lang(ja){font-family:var(--font-reading),'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;line-height:1.9;line-break:strict}
.reading:lang(ko){font-family:var(--font-reading),'AppleMyungjo','Batang','Noto Serif KR',serif;line-height:1.9;word-break:keep-all}
.reading:lang(zh){font-family:var(--font-reading),'Songti SC','SimSun','Noto Serif SC',serif;line-height:1.9;line-break:strict}
.reading:lang(zh-TW),.reading:lang(zh-Hant){font-family:var(--font-reading),'Songti TC','PMingLiU','Noto Serif TC',serif;line-height:1.9;line-break:strict}
.msr{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
.msr-fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
a{color:var(--accent-text)}a:hover{color:var(--text)}
</style>
</head>
<body>
<div data-theme="light" data-type="jakarta" style="width: 390px; height: 844px; box-sizing: border-box; padding: 96px 24px 32px; display: flex; flex-direction: column; background: var(--surface); font-family: var(--font-ui), system-ui, sans-serif; color: var(--text); overflow: hidden">
<main style="display: flex; justify-content: center">
<div style="width: 100%; max-width: 100%; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<svg width="46" height="52" viewBox="13 0 500 570" aria-hidden="true"><defs><linearGradient id="lggl" x1="25" y1="0" x2="228" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1F7EF6"/><stop offset="1" stop-color="#2F7AF7"/></linearGradient><linearGradient id="lggr" x1="228" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5E6FF8"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><linearGradient id="lggs" x1="128" y1="190" x2="385" y2="10" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8EA2F9"/><stop offset="1" stop-color="#86A0FA"/></linearGradient></defs><path d="M128 147 L350 24 Q385 5 385 45 L385 100 L230 190 Z" fill="url(#lggs)"/><path d="M25 205 Q25 155 72.5 170.5 L228 222 L228 555 L78.8 481.5 Q25 455 25 395 Z" fill="url(#lggl)"/><path d="M228 222 L455.5 130 Q500 112 500 160 L500 350 Q500 400 456.5 424.8 L228 555 Z" fill="url(#lggr)"/><polygon points="226,299 351,363 226,436" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round"/></svg>
<h1 style="margin: 0; font-family: var(--font-display), system-ui, sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.01em">Folio</h1>
</div>
<form style="display: flex; flex-direction: column; gap: 16px" novalidate>
<div hidden data-ref-note="Menu: rendered when its button is pressed">
<div role="alert" style="display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--danger); color: var(--danger); font-size: 13px; line-height: 1.4"><span class="msr" aria-hidden="true" style="font-size: 18px">error</span><span>Incorrect username or password. Check them and try again.</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="username" style="font-size: 13px; font-weight: 600">Username</label>
<div style="position: relative">
<input id="username" name="username" type="text" autocomplete="username" value="[username]" aria-invalid="false" style="width: 100%; box-sizing: border-box; height: 44px; padding: 0 12px 0 12px; border-radius: 6px; border: 1px solid var(--control-border); background: var(--surface); color: var(--text); font: inherit; font-size: 15px">

</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="password" style="font-size: 13px; font-weight: 600">Password</label>
<div style="position: relative">
<input id="password" name="password" type="password" autocomplete="current-password" value="xxxxxxxxxx" aria-invalid="false" style="width: 100%; box-sizing: border-box; height: 44px; padding: 0 44px 0 12px; border-radius: 6px; border: 1px solid var(--control-border); background: var(--surface); color: var(--text); font: inherit; font-size: 15px">
<button type="button" aria-label="Show password" aria-pressed="false" style="position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; border-radius: 6px; background: transparent; color: var(--text-2); display: flex; align-items: center; justify-content: center"><span class="msr" aria-hidden="true" style="font-size: 20px">visibility</span></button>
</div>
</div>
<button type="submit" style="height: 48px; border: 0; border-radius: 6px; background-image: linear-gradient(135deg, #1A6FE0, #7C4DEB); color: var(--on-primary); font: inherit; font-size: 15px; font-weight: 700">Sign in</button>
</form>
</div>
</main>
</div>
</body>
</html>

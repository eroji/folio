# Folio reverse proxy. Mounted at /etc/nginx/conf.d/default.conf; the api is reached by
# name on the compose network, so nothing here needs the host port.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name folio.dotslash.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name folio.dotslash.io;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Uploads are limited by MAX_UPLOAD_MB=200 in the app; allow the same over the wire.
    client_max_body_size 200m;

    # Resolve api:8000 at request time (Docker's DNS) so nginx starts even while the
    # api container is still restarting, instead of failing on a missing upstream.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $folio_api http://api:8000;

    # Server-sent events: buffering would hold every job status until the stream ends.
    location /api/v1/events {
        proxy_pass $folio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Vite bundles are content-hashed, so they can be cached for a year.
    location /assets/ {
        proxy_pass $folio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass $folio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Audio segments can take a while to synthesize on first play.
        proxy_read_timeout 300s;
    }
}

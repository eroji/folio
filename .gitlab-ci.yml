# Tag-driven build + deploy for Folio.
#
# Required CI/CD variables (Settings > CI/CD > Variables, masked):
#   HARBOR_USER    Harbor user/robot with push rights to dotslash/folio.
#   HARBOR_TOKEN   Its password or robot token, used for `docker login`.
#   DEPLOY_SSH_KEY base64 (-w0) of an ed25519 private key whose public half is in
#                  deploy@folio.dotslash.io:~/.ssh/authorized_keys.
#
# Only release tags create a pipeline: `git tag v1.2.3 && git push origin v1.2.3`
# builds :v1.2.3 + :latest and deploys :v1.2.3. Branch pushes never build or deploy.

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

stages: [build, deploy]

variables:
  HARBOR_IMAGE: "harbor.dotslash.io/dotslash/folio"

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  interruptible: true
  variables:
    # The full history is needed for the release tag; an empty cert dir makes dind
    # listen on plain tcp://docker:2375 (the runner is configured tls_verify=false).
    GIT_DEPTH: 0
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - |
      if [ -z "${HARBOR_USER:-}" ] || [ -z "${HARBOR_TOKEN:-}" ]; then
        echo "HARBOR_USER and HARBOR_TOKEN must be set as CI/CD variables."
        echo "For tag pipelines they must be unprotected (or the tag must be protected)."
        exit 1
      fi
      echo "$HARBOR_TOKEN" | docker login harbor.dotslash.io -u "$HARBOR_USER" --password-stdin
  script:
    - |
      echo "Building $HARBOR_IMAGE:$CI_COMMIT_TAG (and :latest)"
      docker build -f Dockerfile -t "$HARBOR_IMAGE:$CI_COMMIT_TAG" -t "$HARBOR_IMAGE:latest" .
      docker push "$HARBOR_IMAGE:$CI_COMMIT_TAG"
      docker push "$HARBOR_IMAGE:latest"
      echo "DEPLOY_IMAGE=$HARBOR_IMAGE:$CI_COMMIT_TAG" > build.env
  artifacts:
    expire_in: 1 week
    reports:
      dotenv: build.env

# ------------------------------------------------------------------ deploy
# ssh to $DEPLOY_USER@$DEPLOY_HOST (no sudo, docker group), copy the compose files
# and the nginx config, log in to Harbor over stdin, pin FOLIO_IMAGE in .env,
# recreate the stack and check health both on loopback and through nginx.
deploy:
  stage: deploy
  image: alpine:latest
  timeout: 20 minutes
  needs: [build]
  environment:
    name: production
    url: https://folio.dotslash.io
  variables:
    DEPLOY_HOST: folio.dotslash.io
    DEPLOY_USER: deploy
    DEPLOY_PATH: /opt/folio
    HEALTH_URL: http://127.0.0.1:8000/healthz
    PUBLIC_HEALTH_URL: https://folio.dotslash.io/healthz
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - printf '%s' "$DEPLOY_SSH_KEY" | tr -dc 'A-Za-z0-9+/=' | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
  script:
    - |
      ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
        "$DEPLOY_USER@$DEPLOY_HOST" \
        "mkdir -p $DEPLOY_PATH/config/nginx $DEPLOY_PATH/tls"
    # Block scalars, not folded plain scalars: a folded "\\\n" becomes "\\ " and scp
    # then looks for a file whose name starts with a space.
    - |
      scp -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
        compose.yaml deploy/compose.https.yaml \
        "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    - |
      scp -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
        deploy/nginx/folio.conf \
        "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/config/nginx/folio.conf"
    - printf '%s' "$HARBOR_TOKEN" > /tmp/harbor_token && chmod 600 /tmp/harbor_token
    - |
      ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
        "$DEPLOY_USER@$DEPLOY_HOST" \
        "docker login harbor.dotslash.io -u '$HARBOR_USER' --password-stdin" < /tmp/harbor_token
      rm -f /tmp/harbor_token
    - |
      ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
        "$DEPLOY_USER@$DEPLOY_HOST" \
        "bash -s -- '$HARBOR_IMAGE:$CI_COMMIT_TAG' '$HEALTH_URL' '$PUBLIC_HEALTH_URL'" <<'REMOTE'
      set -euo pipefail
      IMAGE="$1"; HEALTH="$2"; PUBLIC_HEALTH="$3"
      cd /opt/folio
      touch .env
      grep -v '^FOLIO_IMAGE=' .env > .env.tmp || true
      printf 'FOLIO_IMAGE=%s\n' "$IMAGE" >> .env.tmp
      mv .env.tmp .env
      chmod 600 .env
      docker compose -f compose.yaml -f compose.https.yaml pull
      docker compose -f compose.yaml -f compose.https.yaml up -d --remove-orphans
      # The api must answer on loopback and the whole path through nginx must work.
      for i in $(seq 1 60); do
        if curl -fsS "$HEALTH" >/dev/null \
           && curl -fsS --resolve folio.dotslash.io:443:127.0.0.1 "$PUBLIC_HEALTH" >/dev/null; then
          echo READY
          exit 0
        fi
        sleep 5
      done
      docker compose -f compose.yaml -f compose.https.yaml ps || true
      docker compose -f compose.yaml -f compose.https.yaml logs --tail 120 api worker nginx || true
      exit 1
      REMOTE

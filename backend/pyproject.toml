[project]
name = "folio"
version = "0.1.0"
description = "Folio — self-hosted audiobook catalog from EPUB/PDF/Kindle uploads"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "beautifulsoup4==4.15.0",
    "bleach==6.4.0",
    "EbookLib==0.20",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "ldap3==2.9.1",
    "lxml==6.1.3",
    "mutagen==1.48.1",
    "pillow==13.0.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "PyMuPDF==1.26.7",
    "pysbd==0.3.4",
    "sqlalchemy==2.1.6",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

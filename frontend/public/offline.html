<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0C" />
    <title>Folio — offline</title>
    <style>
      /* Brand tokens inlined from src/styles/tokens.css (Direction D, dark
         only); no JS bundles here. */
      :root {
        color-scheme: dark;
        --page: #0b0b0c;
        --ink: #f7f7f2;
        --muted: #a9a9b0;
        --accent: #ffc233;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--page);
        color: var(--ink);
        font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-width: 360px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      button {
        margin-top: 8px;
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--page);
        font: 700 16px/1 ui-sans-serif, system-ui, sans-serif;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="64" height="64" viewBox="0 0 48 48" role="img" aria-label="Folio">
        <path d="M12 4h24a2 2 0 0 1 2 2v38l-14-9-14 9V6a2 2 0 0 1 2-2z" fill="#ffc233" />
        <path d="M20 14v14l11-7z" fill="#0b0b0c" />
      </svg>
      <h1>You're offline</h1>
      <p>Folio couldn't reach the server. Cached books and covers still work; everything else waits for a connection.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
